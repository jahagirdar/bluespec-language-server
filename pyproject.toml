[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "bsv-language-server"
dynamic = ["version"]
description = "A Language Server for Bluespec SystemVerilog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygls>=2.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-bsv>=0.1.0",
]

[project.scripts]
bsv_language_server = "bsv_language_server.server:main"
bsv_format = "bsv_language_server.bsv_formatter:main"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
